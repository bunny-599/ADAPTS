# Server Configuration
server.port=8080

# Logging Configurations
logging.level.org.springframework.web=INFO
logging.level.com.adapts=DEBUG

# Spring Boot JSON settings
spring.jackson.deserialization.fail-on-unknown-properties=false

# Gemini AI API Configuration
# Reads from environment variable VITE_GEMINI_API_KEY or GEMINI_API_KEY. Defaults to empty.
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
gemini.api.key=${GEMINI_API_KEY}

# ==========================================
# DATABASE CONFIGURATION
# ==========================================

# Default Profile: In-Memory H2 Database (Enables running out-of-the-box)
spring.datasource.url=jdbc:h2:mem:adaptsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Uncomment the configuration below to switch to a PostgreSQL database
# spring.datasource.url=jdbc:postgresql://localhost:5432/adapts
